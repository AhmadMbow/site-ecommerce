<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc107"/>
      <stop offset="50%" style="stop-color:#ffdb4d"/>
      <stop offset="100%" style="stop-color:#e6ac00"/>
    </linearGradient>
    <linearGradient id="hangerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd54f"/>
      <stop offset="100%" style="stop-color:#c79100"/>
    </linearGradient>
  </defs>
  
  <!-- Background pill -->
  <rect x="0" y="0" width="320" height="80" rx="12" fill="#1a1a1a"/>
  
  <!-- Hanger Icon -->
  <g transform="translate(15, 12)">
    <!-- Hanger hook -->
    <path d="M28 8 C28 4, 31 2, 34 2 C37 2, 40 4, 40 8 C40 11, 38 13, 36 14" 
          fill="none" stroke="url(#hangerGradient)" stroke-width="3" stroke-linecap="round"/>
    <!-- Hanger body -->
    <path d="M34 14 L34 18 L8 38 L8 42 L60 42 L60 38 L34 18" 
          fill="none" stroke="url(#hangerGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- T-shirt silhouette on hanger -->
    <path d="M18 42 L18 54 L50 54 L50 42 M18 42 L12 48 L12 44 L18 42 M50 42 L56 48 L56 44 L50 42" 
          fill="url(#goldGradient)" opacity="0.3"/>
  </g>
  
  <!-- SADIBOU text -->
  <text x="85" y="38" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">
    SADIBOU
  </text>
  
  <!-- SHOP text with gold -->
  <text x="222" y="38" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="url(#goldGradient)" letter-spacing="1">
    SHOP
  </text>
  
  <!-- Tagline -->
  <text x="85" y="58" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#888888" letter-spacing="3">
    MODE &amp; TENDANCES
  </text>
  
  <!-- Decorative line -->
  <rect x="85" y="64" width="60" height="2" rx="1" fill="url(#goldGradient)"/>
</svg>
